# Deploy config for the nmmpab-count Worker.
#
# You should not need to run wrangler by hand. Run ./setup.sh instead.
#
# Nothing in this file is a credential. The account and database IDs identify
# things but cannot be used without a login, which is why they are safe in a
# public repository. The two real secrets, SALT and DASH_PASS, are set with
# `wrangler secret put` and never touch the repo.

name = "nmmpab-count"
main = "worker.js"
compatibility_date = "2026-07-01"

# Gregory.l.evans@gmail.com's personal Cloudflare account. Deliberately not the
# Santa Fe Psychedelic Society account: this site states that it is unaffiliated,
# and the Society is a client rather than a party to it.
account_id = "2418db2ff3f95726c374a86551d2436e"

# The Worker answers on count.medical-psilocybin.org and nothing else.
# Wrangler creates the DNS record and the certificate itself, since the zone is
# on Cloudflare DNS in this account.
#
# It is a sibling of the site's hostname, not a route on it. GitHub Pages
# already serves rules.medical-psilocybin.org directly, and putting a Worker
# route on that hostname would mean switching its DNS record to proxied and
# depending on the zone's SSL mode being Full, which can take the live site
# down. A separate hostname has the same blocking profile, since a network
# filter blocks the registrable domain, and cannot break the site.
workers_dev = false

# Versioned preview URLs are off. They are covered by the same password as the
# dashboard, so this is tidiness rather than a hole, but a private dashboard
# does not need extra addresses that answer on it.
preview_urls = false

[[routes]]
pattern = "count.medical-psilocybin.org"
custom_domain = true

# Created 2026-07-26, primary location WNAM. Schema in schema.sql, already applied.
[[d1_databases]]
binding = "DB"
database_name = "nmmpab-count"
database_id = "6b4b8f4f-38be-4315-9cd1-75a08d10acb6"

[vars]
# Only requests carrying one of these origins are recorded. The github.io
# address is kept because it still resolves and redirects, and because the
# fallback matters more than the extra entry costs.
ALLOWED_ORIGINS = "https://notafeature.github.io,https://rules.medical-psilocybin.org"
DASH_USER = "owner"

[observability]
enabled = true
